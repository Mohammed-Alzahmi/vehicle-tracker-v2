<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>السجلات</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
  <h2>سجلات {{ region_name }}</h2>

  <table class="records">
    <tr>
      <th>المركبة</th>
      <th>الموظف</th>
      <th>الوقت</th>
    </tr>
    {% for r in records %}
    <tr>
      <td>{{ r.vehicle }}</td>
      <td>{{ r.employee }}</td>
      <td>{{ r.time }}</td>
    </tr>
    {% endfor %}
  </table>
</div>

</body>
</html>
