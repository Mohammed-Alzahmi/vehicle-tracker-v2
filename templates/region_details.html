<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجلات {{ region }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body id="pageBody">
<header>
    <img src="{{ url_for('static', filename='shj-gov.png') }}">
    <div class="header-text">
        <h2>سجل حركة المركبات</h2>
        <p>منطقة: {{ region }}</p>
    </div>
    <img src="{{ url_for('static', filename='shj-police.png') }}">
</header>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
        <div style="display: flex; gap: 10px;">
            <button onclick="openCarModal()" style="background:#333; color:white; border:none; padding:10px 15px; border-radius:10px; cursor:pointer; font-family:'Cairo';">🚘 المركبات</button>
            <button id="adminToggleBtn" onclick="toggleAdminMode()" style="background:var(--accent); color:white; border:none; padding:10px 15px; border-radius:10px; cursor:pointer; font-family:'Cairo';">📑 إدارة السجلات</button>
        </div>
        <a href="/" style="text-decoration:none; color:var(--primary); font-weight:bold;">➜ العودة للرئيسية</a>
    </div>

    <div id="adminControls" style="display:none; margin-bottom:15px; text-align:center; background:#eee; padding:10px; border-radius:10px;">
        <button onclick="selectAll()" style="margin-left:10px;">تحديد الكل</button>
        <button onclick="deleteSelected()" style="background:var(--danger); color:white; border:none; padding:5px 15px; border-radius:5px;">حذف</button>
    </div>

    <div style="background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
        <div class="records-table-row" style="background: var(--accent); color: white; font-weight: bold;">
            <div class="record-check"></div> 
            <div>الاسم</div>
            <div>الرقم العسكري</div>
            <div>المركبة</div> <div>وقت الدخول</div>
        </div>
        <div id="recordsList">
            {% for r in records %}
            <div class="records-table-row">
                <input type="checkbox" class="record-check" value="{{ r.id }}">
                <div style="font-weight: 600;">{{ r.name }}</div>
                <div>{{ r.military_id }}</div>
                <div class="type-link">{{ r.car_type }}</div> <div style="font-size: 0.8rem; color: #777;">{{ r.time }}</div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<button class="floating-qr" onclick="showQR()">📷 عرض QR المنطقة</button>

<div id="qrModal" class="modal">
    <div class="qr-content">
        <div id="printArea">
            <h2 style="margin: 0; color: var(--primary);">رمز دخول المركبات</h2>
            <h3 style="margin: 5px 0 15px 0; color: var(--accent);">منطقة: {{ region }}</h3>
            <div id="qrCodeContainer"></div>
        </div>
        
        <div class="qr-link-box" id="qrUrlDisplay"></div>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button onclick="printQR()" style="flex: 1; padding: 10px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer;">🖨️ طباعة</button>
            <button onclick="copyLink()" style="flex: 1; padding: 10px; background: #666; color: white; border: none; border-radius: 8px; cursor: pointer;">📋 نسخ</button>
        </div>
        <p onclick="closeModal('qrModal')" style="color: red; cursor: pointer; margin-top: 15px; font-weight: bold;">إغلاق</p>
    </div>
</div>

<script>
    const REGION_NAME = "{{ region }}";
    
    function toggleAdminMode() {
        const body = document.getElementById('pageBody');
        const controls = document.getElementById('adminControls');
        body.classList.toggle('admin-mode');
        controls.style.display = body.classList.contains('admin-mode') ? 'block' : 'none';
    }

    function showQR() {
        const url = window.location.origin + "/register/" + encodeURIComponent(REGION_NAME);
        const qrContainer = document.getElementById('qrCodeContainer');
        qrContainer.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${url}" id="qrImg" style="width:200px;">`;
        document.getElementById('qrUrlDisplay').innerText = url;
        document.getElementById('qrModal').style.display = 'flex';
    }

    function printQR() {
        const qrSrc = document.getElementById('qrImg').src;
        const win = window.open('', '', 'height=600,width=450');
        win.document.write(`
            <html>
            <head><title>طباعة QR</title>
            <style>
                body { font-family: 'Cairo', sans-serif; text-align: center; padding: 40px; direction: rtl; }
                h1 { color: #0a2a4a; margin-bottom: 0; }
                h2 { color: #c5a059; margin-top: 10px; }
                img { width: 300px; margin-top: 30px; }
            </style>
            </head>
            <body>
                <h1>رمز دخول المركبات</h1>
                <h2>منطقة: ${REGION_NAME}</h2>
                <img src="${qrSrc}">
                <p style="margin-top:40px; color:#888;">نظام إدارة السجلات الرقمي</p>
            </body>
            </html>
        `);
        win.document.close();
        setTimeout(() => { win.print(); win.close(); }, 500);
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function copyLink() {
        const text = document.getElementById('qrUrlDisplay').innerText;
        navigator.clipboard.writeText(text);
        alert("تم نسخ الرابط");
    }
</script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
