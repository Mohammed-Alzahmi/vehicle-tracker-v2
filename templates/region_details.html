<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>{{ region }} | السجلات</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
  <img src="{{ url_for('static', filename='shj-gov.png') }}">
  <h2>سجلات منطقة: {{ region }}</h2>
  <img src="{{ url_for('static', filename='shj-police.png') }}">
</header>

<div style="text-align: center; margin: 30px;">
  <button class="main-btn" onclick="openQR('{{ region }}')">📷 عرض رمز QR</button>
  <a href="/" class="main-btn" style="background: #eee; color: #333; margin-right: 10px;">رجوع</a>
</div>

<ul class="records">
  {% for r in records %}
    <li>
        <span>{{ r }}</span>
        <span style="font-size:0.8em; color:#666;">سجل مركبة</span>
    </li>
  {% else %}
    <li style="justify-content: center; color: #999;">لا توجد سجلات حالياً</li>
  {% endfor %}
</ul>

<div id="qrModal" class="modal" onclick="this.style.display='none'">
  <iframe id="qrFrame"></iframe>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
