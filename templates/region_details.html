<!DOCTYPE html>
<html>
<head>
    <title>{{ region.name }}</title>
</head>
<body>

<h2>Region: {{ region.name }}</h2>

<form method="POST">
    <input type="text" name="note" placeholder="Enter record note" required>
    <button type="submit">Add Record</button>
</form>

<h3>Records</h3>
<ul>
    {% for record in records %}
        <li>
            {{ record.note }} <small>({{ record.created_at }})</small>
        </li>
    {% else %}
        <li>No records yet</li>
    {% endfor %}
</ul>

<a href="/">⬅ Back</a>

</body>
</html>
