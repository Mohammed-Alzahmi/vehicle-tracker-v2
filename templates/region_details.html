<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>السجلات</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>

<header class="header">
  <img src="{{ url_for('static', filename='shj-gov.png') }}">
  <img src="{{ url_for('static', filename='shj-police.png') }}">
</header>

<div class="container">
<h2>{{ region_name }}</h2>

<button class="qr-btn" onclick="showQR('{{ request.host_url }}register/{{ region_id }}')">
عرض QR
</button>

<table>
<tr><th>المركبة</th><th>الموظف</th><th>الوقت</th></tr>
{% for r in records %}
<tr>
<td>{{ r.vehicle }}</td>
<td>{{ r.employee }}</td>
<td>{{ r.time }}</td>
</tr>
{% endfor %}
</table>
</div>

<div id="qrModal" class="modal">
  <div class="modal-content">
    <span onclick="closeQR()">✖</span>
    <img id="qrImage">
    <button onclick="copyLink()">نسخ الرابط</button>
  </div>
</div>

</body>
</html>
