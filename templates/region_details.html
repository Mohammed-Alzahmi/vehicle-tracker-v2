<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ region }}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body id="pageBody">
<header>
    <img src="{{ url_for('static', filename='shj-gov.png') }}">
    <div class="header-text"><h2>سجل حركة المركبات</h2><p>منطقة: {{ region }}</p></div>
    <img src="{{ url_for('static', filename='shj-police.png') }}">
</header>
<div class="container" style="padding: 20px 5%;">
    <div style="display:flex; justify-content:space-between; margin-bottom:20px; align-items:center;">
        <div style="display:flex; gap:8px;">
            <button onclick="document.getElementById('carModal').style.display='flex'" style="background:#333; color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer;">🚘 المركبات</button>
            <button onclick="toggleAdminMode()" style="background:var(--accent); color:white; border:none; padding:10px 15px; border-radius:8px; cursor:pointer;">📑 الإدارة</button>
        </div>
        <a href="/" style="text-decoration:none; color:var(--primary); font-weight:bold;">➜ الرئيسية</a>
    </div>

    <div id="adminControls" style="display:none; text-align:center; margin-bottom:15px;">
        <button onclick="selectAll()" style="padding:8px 15px; border-radius:5px; border:1px solid #ccc;">تحديد الكل</button>
        <button onclick="deleteSelected()" style="padding:8px 15px; background:var(--danger); color:white; border:none; border-radius:5px; margin-right:10px;">حذف</button>
    </div>

    <div style="background:white; border-radius:15px; overflow:hidden; box-shadow:0 5px 15px rgba(0,0,0,0.05);">
        <div class="records-table-row" style="background:var(--accent); color:white; font-weight:bold;">
            <div class="record-check"></div><div>الاسم</div><div>الرقم العسكري</div><div>المركبة</div><div>وقت الدخول</div>
        </div>
        {% for r in records %}
        <div class="records-table-row">
            <div class="record-check"><input type="checkbox" class="record-check-input record-check" value="{{ r.id }}"></div>
            <div style="font-weight:600;">{{ r.name }}</div>
            <div>{{ r.military_id }}</div>
            <div style="color:black; font-weight:bold;">{{ r.car_type }}</div>
            <div style="font-size:0.8rem; color:#777;">{{ r.time }}</div>
        </div>
        {% endfor %}
    </div>
</div>

<div id="carModal" class="modal">
    <div class="car-modal-content">
        <span class="close-x" onclick="closeModal('carModal')">✕</span>
        <h3>قائمة المركبات - {{ region }}</h3>
        <div id="carList" style="max-height: 200px; overflow-y: auto; margin-bottom: 15px;">
            {% for car in car_types %}
            <div class="car-item"><span>{{ car }}</span><span onclick="manageCar('delete', '{{ car }}')" style="color:red; cursor:pointer;">🗑️</span></div>
            {% endfor %}
        </div>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="newCarInput" placeholder="إضافة نوع..." style="flex:1; padding:10px; border:1px solid #ddd; border-radius:8px;">
            <button onclick="addCar()" style="padding:10px 15px; background:var(--primary); color:white; border:none; border-radius:8px;">+</button>
        </div>
    </div>
</div>

<script>const REGION_NAME = "{{ region }}";</script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
