<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>سجل المنطقة</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    <h2>📍 {{ region_name }}</h2>
    <a href="/">⬅ رجوع</a>
</header>

<section class="container">
    <table>
        <tr>
            <th>الموظف</th>
            <th>المركبة</th>
            <th>الوقت</th>
        </tr>
        {% for log in logs %}
        <tr>
            <td>{{ log.employee }}</td>
            <td>{{ log.vehicle }}</td>
            <td>{{ log.time }}</td>
        </tr>
        {% endfor %}
    </table>
</section>

</body>
</html>
