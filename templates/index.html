<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <img src="{{ url_for('static', filename='shj-gov.png') }}">
    <div class="header-text"><h2>نظام سجلات المركبات</h2><p>إدارة الوقاية</p></div>
    <img src="{{ url_for('static', filename='shj-police.png') }}">
</header>
<div class="container">
    <form method="POST" action="/add-region" class="add-region-container">
        <input type="text" name="region" placeholder="اسم المنطقة الجديدة..." required>
        <button type="submit">إضافة +</button>
    </form>
    <div class="regions-grid">
        {% for region in regions %}
        <div class="region-card" onclick="window.location.href='/region/{{ region }}'">
            <div class="dots-container" onclick="event.stopPropagation(); toggleMenu('{{ region }}')">⋮</div>
            <div class="menu" id="menu-{{ region }}" onclick="event.stopPropagation()">
                <button onclick="openEditModal('{{ region }}')">✏️ تعديل</button>
                <button onclick="deleteRegion('{{ region }}')" style="color:red;">🗑️ حذف</button>
            </div>
            <h3 style="margin:0; color:var(--primary);">{{ region }}</h3>
        </div>
        {% endfor %}
    </div>
</div>
<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close-x" onclick="closeModal('editModal')">✕</span>
        <h3>تعديل الاسم</h3>
        <input type="text" id="editInput" style="width:100%; padding:10px; margin:10px 0;">
        <button onclick="saveEdit()" style="width:100%; padding:10px; background:var(--primary); color:white; border:none; border-radius:5px;">حفظ</button>
    </div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
