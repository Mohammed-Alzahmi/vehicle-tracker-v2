<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تسجيل مركبة</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="header">
  <img src="{{ url_for('static', filename='shj-gov.png') }}">
  <img src="{{ url_for('static', filename='shj-police.png') }}">
</header>

<div class="register-box">
<h2>تسجيل دخول مركبة</h2>

{% if success %}
<div class="success">✅ تم التسجيل</div>
{% endif %}

<form method="POST">
<input name="vehicle" placeholder="رقم المركبة" required>
<input name="employee" placeholder="اسم الموظف" required>
<button>تسجيل</button>
</form>
</div>

</body>
</html>
