<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام تتبع المركبات</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
  <img src="{{ url_for('static', filename='shj-gov.png') }}" alt="Government Logo">
  <h2>نظام إدارة المركبات</h2>
  <img src="{{ url_for('static', filename='shj-police.png') }}" alt="Police Logo">
</header>

<div class="container">
  <form method="POST" action="/add-region" class="add-box">
    <input name="region" placeholder="إضافة منطقة جديدة..." required>
    <button type="submit">إضافة +</button>
  </form>

  <div class="regions">
    {% for region in regions %}
    <div class="region-card">
      <a href="/region/{{ region }}">{{ region }}</a>
      <span class="dots" onclick="toggleMenu('{{ region }}')">⋮</span>

      <div class="menu" id="menu-{{ region }}">
        <button onclick="editRegion('{{ region }}')">✏️ تعديل</button>
        <button onclick="deleteRegion('{{ region }}')" style="color:red">🗑️ حذف</button>
      </div>
    </div>
    {% endfor %}
  </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
