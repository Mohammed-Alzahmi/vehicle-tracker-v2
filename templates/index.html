<div class="container">
    <form method="POST" action="/add-region" class="add-region-container">
        <input type="text" name="region" placeholder="أدخل اسم المنطقة..." required>
        <button type="submit">إضافة منطقة جديدة +</button>
    </form>

    <div class="regions-grid">
        {% for region in regions %}
        <div class="region-card">
            <div class="dots-container" onclick="toggleMenu('{{ region }}', event)">
                <span>⋮</span>
            </div>
            <div class="menu" id="menu-{{ region }}">
                <button onclick="editRegion('{{ region }}')">📝 تعديل</button>
                <button onclick="deleteRegion('{{ region }}')" style="color:red;">🗑️ حذف</button>
            </div>
            <a href="/region/{{ region }}" class="region-title">{{ region }}</a>
            <p style="margin-top:20px; color:#666; font-size:0.9rem;">اضغط لعرض السجلات ➜</p>
        </div>
        {% endfor %}
    </div>
</div>
