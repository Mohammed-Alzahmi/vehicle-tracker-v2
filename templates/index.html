<!DOCTYPE html>
<html>
<head>
  <title>Vehicle Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <img src="/static/shj-police.png">
  <h2>Vehicle Tracker</h2>
  <img src="/static/shj-gov.png">
</header>

<form method="POST" action="/add-region" class="add-box">
  <input name="region" placeholder="Add Region / إضافة منطقة" required>
  <button>Add</button>
</form>

<div class="regions">
  {% for region in regions %}
  <div class="region-card">
    <a href="/region/{{ region }}">{{ region }}</a>
    <span class="dots" onclick="toggleMenu('{{ region }}')">⋮</span>

    <div class="menu" id="menu-{{ region }}">
      <button onclick="editRegion('{{ region }}')">Edit</button>
      <button onclick="deleteRegion('{{ region }}')">Delete</button>
    </div>
  </div>
  {% endfor %}
</div>

<script src="/script.js"></script>
</body>
</html>
