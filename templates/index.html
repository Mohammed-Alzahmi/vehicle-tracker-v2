<!DOCTYPE html>
<html>
<head>
    <title>Vehicle Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>Vehicle Tracker System</h1>

<form method="POST">
    <input type="text" name="region" placeholder="Enter region name" required>
    <button type="submit">Add Region</button>
</form>

<ul>
    {% for region in regions %}
        <li>
            <a href="{{ url_for('region_details', region_id=region.id) }}">
                {{ region.name }}
            </a>
        </li>
    {% endfor %}
</ul>

</body>
</html>
