<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="mobile">

<div class="qr-box">
    <h2>تسجيل دخول مركبة</h2>

    <form id="regForm">
        <input type="hidden" name="region" value="{{ region_name }}">

        <input type="text" name="employee" placeholder="اسم الموظف" required>
        <input type="text" name="vehicle" placeholder="رقم المركبة" required>

        <button type="submit">✅ تسجيل</button>
    </form>

    <p id="success" class="success">تم التسجيل بنجاح ✅</p>
</div>

<script>
document.getElementById("regForm").onsubmit = async function(e) {
    e.preventDefault();
    const formData = new FormData(this);

    await fetch("/register", {
        method: "POST",
        body: formData
    });

    document.getElementById("success").style.display = "block";
    this.reset();
};
</script>

</body>
</html>
