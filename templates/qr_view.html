<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Region Details</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f4efe6;
            margin: 0;
            color: #3b2f1c;
        }

        header {
            background: #2f2416;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #d4af37;
            margin: 0;
        }

        .container {
            padding: 30px;
            max-width: 1100px;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 25px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        img {
            width: 100%;
            max-width: 250px;
            display: block;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #f1e6c9;
        }

        @media(max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>تفاصيل المنطقة</h1>
</header>

<div class="container">

    <div class="box">
        <h3><i class="fa fa-qrcode"></i> QR Code</h3>
        <img src="{{ url_for('static', filename=qr_filename) }}">
    </div>

    <div class="box">
        <h3><i class="fa fa-list"></i> السجلات</h3>
        <table>
            <tr>
                <th>الوقت</th>
                <th>الموظف</th>
            </tr>
            {% for log in logs %}
            <tr>
                <td>{{ log.time }}</td>
                <td>{{ log.name }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>

</div>

</body>
</html>
