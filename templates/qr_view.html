<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QR Code</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(to bottom, #f5efe6, #e6d3b1);
            color: #3b2f1c;
        }

        .header {
            background-color: #3b2f1c;
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header img {
            height: 60px;
        }

        .title {
            color: #d4af37;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            flex: 1;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
        }

        img.qr {
            margin-top: 20px;
            width: 260px;
        }

        a {
            display: inline-block;
            margin-top: 25px;
            text-decoration: none;
            color: #d4af37;
            font-weight: bold;
        }

        footer {
            margin-top: 60px;
            text-align: center;
            font-size: 13px;
            color: #6b5a3a;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="{{ url_for('static', filename='shj-police.png') }}">
        <div class="title">Vehicle Tracker System</div>
        <img src="{{ url_for('static', filename='shj-gov.png') }}">
    </div>

    <div class="container">
        <h2>Generated QR Code</h2>
        <p><strong>{{ data }}</strong></p>
        <img class="qr" src="{{ url_for('static', filename=qr_filename) }}">
        <br>
        <a href="/">← Back to Home</a>
    </div>

    <footer>
        © Sharjah Government – Vehicle Tracking System
    </footer>

</body>
</html>
