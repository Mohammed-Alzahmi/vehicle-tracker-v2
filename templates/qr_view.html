<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>QR</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="center">

<div class="qr-card">
<h3>{{ region }}</h3>

<button onclick="showQR()">عرض QR</button>

<div id="qrBox" class="hidden">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data={{ request.url_root }}qr?region={{ region }}">
    <input value="{{ request.url_root }}qr?region={{ region }}" readonly>
    <button onclick="copy()">نسخ الرابط</button>
</div>
</div>

<script>
function showQR(){
    document.getElementById("qrBox").classList.remove("hidden")
}

function copy(){
    navigator.clipboard.writeText(document.querySelector("input").value)
    alert("تم النسخ ✅")
}
</script>

</body>
</html>
