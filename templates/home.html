<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Vehicle Tracker</title>
<style>
body {
    font-family: Arial;
    background: #f5efe6;
    margin: 0;
}
header {
    background: white;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
header img {
    height: 50px;
}
.container {
    padding: 20px;
}
.region {
    background: #fff;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 10px;
}
</style>
</head>
<body>

<header>
    <img src="/static/shj-police.png">
    <strong>Vehicle Tracker System</strong>
    <img src="/static/shj-gov.png">
</header>

<div class="container">
<form method="POST" action="/add_region">
    <input name="region" placeholder="اسم المنطقة" required>
    <button>إضافة</button>
</form>

<hr>

{% for region in regions %}
<div class="region">
    <strong>{{ region }}</strong><br>
    <a href="/records/{{ region }}">عرض السجلات</a> |
    <a href="/register/{{ region }}">تسجيل جديد</a>
</div>
{% endfor %}
</div>

</body>
</html>
