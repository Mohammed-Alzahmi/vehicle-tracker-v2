<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="/static/style.css">
<script src="/script.js"></script>
</head>
<body>

<header>
  <div class="logo"><img src="/static/shj-police.png"></div>
  <div class="logo"><img src="/static/shj-gov.png"></div>
</header>

<div class="container">
<form method="post" action="/add_region">
  <input name="region" placeholder="اسم المنطقة" required>
  <button>إضافة منطقة</button>
</form>

{% for id, r in regions.items() %}
<div class="card">
  <div class="menu" onclick="toggleMenu('{{id}}')">⋮</div>
  <div id="{{id}}" class="menu-box">
    <a href="/region/{{id}}">عرض السجلات</a>
  </div>
  <h3>{{ r.name }}</h3>
</div>
{% endfor %}
</div>

</body>
</html>
