<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Vehicle Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="top-header">
    <img src="{{ url_for('static', filename='shj-gov.png') }}">
    <img src="{{ url_for('static', filename='shj-police.png') }}">
</header>

<div class="container">
    <h2>المناطق</h2>

    <form method="POST" action="/add_region">
        <input type="text" name="region_name" placeholder="اسم المنطقة" required>
        <button>إضافة</button>
    </form>

    <div class="regions">
        {% for id, name in regions.items() %}
        <div class="region-card">
            <h3>{{ name }}</h3>
            <a href="/region/{{ id }}">السجلات</a>
            <a href="/qr/{{ id }}">QR</a>
        </div>
        {% endfor %}
    </div>
</div>

</body>
</html>
