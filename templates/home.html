<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vehicle Tracker System</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(to bottom, #f5efe6, #e6d3b1);
            color: #3b2f1c;
        }

        .header {
            background-color: #3b2f1c;
            padding: 15px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header img {
            height: 60px;
        }

        .title {
            color: #d4af37;
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            flex: 1;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #3b2f1c;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #c9b37e;
            margin-bottom: 20px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #3b2f1c;
            color: #d4af37;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #2a2114;
        }

        footer {
            margin-top: 60px;
            text-align: center;
            font-size: 13px;
            color: #6b5a3a;
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="{{ url_for('static', filename='shj-police.png') }}">
        <div class="title">Vehicle Tracker System</div>
        <img src="{{ url_for('static', filename='shj-gov.png') }}">
    </div>

    <div class="container">
        <h2>Add Area / Vehicle</h2>
        <form method="POST">
            <input type="text" name="data" placeholder="Enter Area or Vehicle ID" required>
            <button type="submit">Generate QR Code</button>
        </form>
    </div>

    <footer>
        © Sharjah Government – Vehicle Tracking System
    </footer>

</body>
</html>
