<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sharjah Police - QR Generator</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0b2c4a, #133e66);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background-color: #ffffff;
            color: #000;
            width: 420px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            text-align: center;
        }

        .card img {
            width: 90px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #0b2c4a;
        }

        p {
            font-size: 14px;
            color: #555;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background-color: #0b2c4a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #133e66;
        }

        footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- إذا عندج شعار حطي مساره هنا -->
        <!-- <img src="{{ url_for('static', filename='logo.png') }}"> -->

        <h1>Sharjah Police QR System</h1>
        <p>Generate a secure QR code easily</p>

        <form method="POST">
            <input type="text" name="data" placeholder="Enter text or link" required>
            <button type="submit">Generate QR Code</button>
        </form>

        <footer>
            © Sharjah Police
        </footer>
    </div>

</body>
</html>
