<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Vehicle Tracker | Dashboard</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f4efe6;
            color: #3b2f1c;
        }

        header {
            background: #2f2416;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header img {
            height: 55px;
        }

        header h1 {
            color: #d4af37;
            margin: 0;
            font-size: 24px;
        }

        .container {
            padding: 40px;
            max-width: 1100px;
            margin: auto;
        }

        .add-box {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
            margin-bottom: 40px;
        }

        .add-box input {
            width: 70%;
            padding: 14px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #c9b37e;
        }

        .add-box button {
            padding: 14px 22px;
            background: #2f2416;
            color: #d4af37;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 30px;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.18);
            position: relative;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: #d4af37;
            border-radius: 16px 16px 0 0;
        }

        .card h3 {
            margin-bottom: 25px;
        }

        .actions a {
            margin-left: 15px;
            font-size: 20px;
            color: #2f2416;
        }

        footer {
            margin-top: 60px;
            text-align: center;
            font-size: 13px;
            color: #6b5a3a;
        }
    </style>
</head>

<body>

<header>
    <img src="{{ url_for('static', filename='shj-police.png') }}">
    <h1>Vehicle Tracker System</h1>
    <img src="{{ url_for('static', filename='shj-gov.png') }}">
</header>

<div class="container">

    <div class="add-box">
        <form method="POST">
            <input type="text" name="data" placeholder="إضافة منطقة جديدة" required>
            <button type="submit">
                <i class="fa fa-plus"></i> إضافة
            </button>
        </form>
    </div>

    <div class="cards">
        {% for region in regions %}
        <div class="card">
            <h3><i class="fa fa-map-location-dot"></i> {{ region }}</h3>
            <div class="actions">
                <a href="/view/{{ region }}"><i class="fa fa-eye"></i></a>
                <a href="/delete/{{ region }}"><i class="fa fa-trash"></i></a>
            </div>
        </div>
        {% endfor %}
    </div>

</div>

<footer>
    © Sharjah Government – Vehicle Tracking System
</footer>

</body>
</html>
