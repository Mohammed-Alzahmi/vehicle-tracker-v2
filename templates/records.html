<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>سجلات {{ region }}</title>
</head>
<body>

<h2>سجلات منطقة {{ region }}</h2>
<a href="/">⬅ رجوع</a>

<table border="1" cellpadding="10">
<tr>
<th>الاسم</th>
<th>المركبة</th>
<th>الوقت</th>
<th>QR</th>
</tr>

{% for r in records %}
<tr>
<td>{{ r.name }}</td>
<td>{{ r.vehicle }}</td>
<td>{{ r.time }}</td>
<td>
<a href="/static/qr/{{ r.qr }}" target="_blank">عرض QR</a>
</td>
</tr>
{% endfor %}
</table>

</body>
</html>
